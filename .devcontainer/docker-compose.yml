# Service containers for the dev container. The db/redis/nats definitions mirror
# the root docker-compose.yml so local behaviour matches; the `app` service holds
# the workspace instead of running the API, so the API is started by hand.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - db
      - redis
      - nats

  db:
    # Unpinned to match the root docker-compose.yml.
    image: postgis/postgis
    environment:
      - POSTGRES_USER=wps
      - POSTGRES_PASSWORD=wps
      - POSTGRES_DB=wps
    volumes:
      # Creates the read-only `wpsread` role the app expects. The postgis image
      # only creates POSTGRES_USER, and it enables the postgis extension itself.
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-wps.sql:ro
      - wps-db-data:/var/lib/postgresql/data

  redis:
    image: redis

  nats:
    image: nats
    command: -js

volumes:
  wps-db-data:
